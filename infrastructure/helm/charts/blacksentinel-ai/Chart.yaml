apiVersion: v2
name: blacksentinel-ai
description: BlackSentinel AI - Cyber Cognitive Intelligence Engine
type: application
version: 1.0.0
appVersion: "1.0.0"

maintainers:
  - name: BlackSentinel Team
    email: team@blacksentinel.ai

keywords:
  - ai
  - security
  - cyber
  - cognitive

dependencies:
  - name: redis
    version: "18.x"
    repository: "https://charts.bitnami.com/bitnami"
    condition: redis.enabled
  - name: postgresql
    version: "13.x"
    repository: "https://charts.bitnami.com/bitnami"
    condition: postgresql.enabled
