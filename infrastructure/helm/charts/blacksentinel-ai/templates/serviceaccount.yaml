{{/*
The Deployment references a ServiceAccount by name but nothing in this chart
ever created one — values.yaml's security.serviceAccount.create: true
implied this should exist. Added.
*/}}
{{- if .Values.security.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "blacksentinel-ai.fullname" . }}
  labels:
    {{- include "blacksentinel-ai.labels" . | nindent 4 }}
{{- end }}
