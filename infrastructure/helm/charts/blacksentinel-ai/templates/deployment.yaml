{{/*
BlackSentinel AI - Main Deployment Template
*/}}
{{- define "blacksentinel-ai.name" -}}
{{- default .Chart.Name .Values.nameOverride | trunc 63 | trimSuffix "-" }}
{{- end }}

{{- define "blacksentinel-ai.fullname" -}}
{{- if .Values.fullnameOverride }}
{{- .Values.fullnameOverride | trunc 63 | trimSuffix "-" }}
{{- else }}
{{- $name := default .Chart.Name .Values.nameOverride }}
{{- if contains $name .Release.Name }}
{{- .Release.Name | trunc 63 | trimSuffix "-" }}
{{- else }}
{{- printf "%s-%s" .Release.Name $name | trunc 63 | trimSuffix "-" }}
{{- end }}
{{- end }}
{{- end }}

{{- define "blacksentinel-ai.chart" -}}
{{- printf "%s-%s" .Chart.Name .Chart.Version | replace "+" "_" | trunc 63 | trimSuffix "-" }}
{{- end }}

{{- define "blacksentinel-ai.labels" -}}
helm.sh/chart: {{ include "blacksentinel-ai.chart" . }}
{{ include "blacksentinel-ai.selectorLabels" . }}
{{- if .Chart.AppVersion }}
app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
{{- end }}
app.kubernetes.io/managed-by: {{ .Release.Service }}
{{- end }}

{{- define "blacksentinel-ai.selectorLabels" -}}
app.kubernetes.io/name: {{ include "blacksentinel-ai.name" . }}
app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}

{{/*
BlackSentinel AI Deployment — one Deployment for the one real service.
This used to be templated as "-ai-engine" with a matching set of sibling
services (agent-orchestrator, knowledge-graph, memory-service) that
values.yaml declared replica counts for but that had no templates of their
own anywhere in this chart, and that reused the same broken multi-image
assumption as infrastructure/kubernetes/base (see that directory's
comments) — image "<repo>/ai-engine:<tag>" was never a real image path.
There's one image, built by .github/workflows/ci-cd.yml from
infrastructure/docker/Dockerfile.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "blacksentinel-ai.fullname" . }}
  labels:
    {{- include "blacksentinel-ai.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "blacksentinel-ai.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "blacksentinel-ai.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "blacksentinel-ai.fullname" . }}
      containers:
        - name: blacksentinel-ai
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: NODE_ENV
              value: "production"
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "blacksentinel-ai.fullname" . }}-secrets
                  key: redis-url
            - name: POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "blacksentinel-ai.fullname" . }}-secrets
                  key: postgres-url
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "blacksentinel-ai.fullname" . }}-secrets
                  key: jwt-secret
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "blacksentinel-ai.fullname" . }}-secrets
                  key: encryption-key
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "blacksentinel-ai.fullname" . }}
  labels:
    {{- include "blacksentinel-ai.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "blacksentinel-ai.selectorLabels" . | nindent 4 }}
{{/*
HorizontalPodAutoscaler
*/}}
{{- if .Values.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "blacksentinel-ai.fullname" . }}-hpa
  labels:
    {{- include "blacksentinel-ai.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "blacksentinel-ai.fullname" . }}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetCPUUtilization }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetMemoryUtilization }}
{{- end }}
