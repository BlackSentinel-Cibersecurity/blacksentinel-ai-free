{{/*
The Deployment references a Secret (redis-url, postgres-url, jwt-secret,
encryption-key) that nothing in this chart ever created. Added, sourced
from .Values.secrets — for a real deployment, override these at install
time (`helm install ... --set secrets.jwtSecret=...` or a values file kept
out of version control) rather than committing real values here, same as
the CHANGE_ME placeholders already used for the bitnami subchart passwords
below in values.yaml. A dedicated secrets manager (Vault, AWS Secrets
Manager, sealed-secrets) is the real answer for production; this template
is the minimum to make `helm install` actually work.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "blacksentinel-ai.fullname" . }}-secrets
  labels:
    {{- include "blacksentinel-ai.labels" . | nindent 4 }}
type: Opaque
stringData:
  redis-url: {{ .Values.secrets.redisUrl | quote }}
  postgres-url: {{ .Values.secrets.postgresUrl | quote }}
  jwt-secret: {{ .Values.secrets.jwtSecret | quote }}
  encryption-key: {{ .Values.secrets.encryptionKey | quote }}
