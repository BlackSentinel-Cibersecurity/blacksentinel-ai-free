# BLACKSENTINEL AI - Prometheus Configuration

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'blacksentinel-ai'
    static_configs:
      - targets: ['ai-engine:8080']
    metrics_path: '/metrics'
    scrape_interval: 5s

  - job_name: 'blacksentinel-agents'
    static_configs:
      - targets: ['agent-orchestrator:8081']
    metrics_path: '/metrics'
    scrape_interval: 5s

  - job_name: 'blacksentinel-knowledge'
    static_configs:
      - targets: ['knowledge-graph:8082']
    metrics_path: '/metrics'
    scrape_interval: 5s

  - job_name: 'blacksentinel-memory'
    static_configs:
      - targets: ['memory-service:8083']
    metrics_path: '/metrics'
    scrape_interval: 5s
